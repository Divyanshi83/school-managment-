<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="login-card">

            <!-- ================= LEFT PANEL ================= -->

            <section class="left-panel">

                <!-- SCHOOL LOGO -->
                <div class="school-logo">
                    <img src="logo.jpeg" alt="School Logo">
                </div>


                <!-- SCHOOL CONTENT -->
                <div class="school-content">

                    <h1>
                        School<br>
                        Management<br>
                        System
                    </h1>

                    <div class="green-line"></div>

                    <p>
                        Empowering educators,<br>
                        inspiring students,<br>
                        building the future.
                    </p>

                </div>


                <!-- ================= SCHOOL ILLUSTRATION ================= -->

                <div class="school-illustration">

                    <!-- FLAG -->
                    <div class="flag">
                        <span></span>
                    </div>

                    <!-- SCHOOL ROOF -->
                    <div class="school-roof"></div>

                    <!-- SCHOOL BUILDING -->
                    <div class="school-building">

                        <div class="window left-window"></div>

                        <div class="window right-window"></div>

                        <div class="door"></div>

                    </div>

                    <!-- CLOCK -->
                    <div class="clock">

                        <div class="clock-hand hour"></div>

                        <div class="clock-hand minute"></div>

                    </div>

                    <!-- GROUND -->
                    <div class="school-ground"></div>

                    <!-- BOOKS -->
                    <div class="books">

                        <div class="book book-one"></div>
                        <div class="book book-two"></div>
                        <div class="book book-three"></div>
                        <div class="book book-four"></div>

                    </div>

                </div>

            </section>


            <!-- ================= RIGHT PANEL ================= -->

            <section class="right-panel">

                <!-- WELCOME SECTION -->

                <div class="welcome-section">

                    <!-- TEACHER ICON -->
                    <div class="teacher-icon">

                        <div class="cap"></div>

                        <div class="cap-bottom"></div>

                        <div class="tassel"></div>

                    </div>


                    <!-- WELCOME TEXT -->

                    <div class="welcome-text">

                        <div class="welcome">
                            Welcome back!
                        </div>

                        <h2>
                            Hello, Teacher
                        </h2>

                        <p class="subtitle">
                            Sign in to continue to your dashboard
                        </p>

                    </div>

                </div>


                <!-- DIVIDER -->

                <div class="divider"></div>


                <!-- ================= LOGIN FORM ================= -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-box">

                            <span class="input-icon email-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@school.edu"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group password-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box password-box">


                            <!-- CLEAN LOCK ICON -->
                            <span
                                class="input-icon password-icon"
                                aria-hidden="true">
                            </span>


                            <!-- PASSWORD INPUT -->

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <!-- EYE BUTTON -->

                           <button
                        type="button"
                        class="eye-button"
                        id="togglePassword"
                        aria-label="Show password">

                        <svg
                            class="eye-icon"
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">

                            <!-- CLOSED EYE -->
                            <path
                                d="M3 3L21 21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                            <path
                                d="M10.6 10.6C10.2 11 10 11.5 10 12C10 13.1 10.9 14 12 14C12.5 14 13 13.8 13.4 13.4"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"/>

                            <path
                                d="M9.9 5.3C10.6 5.1 11.3 5 12 5C16.3 5 19.6 7.2 21.5 12C20.8 13.7 19.8 15 18.5 16"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>

                            <path
                                d="M6.2 6.2C4.7 7.5 3.6 9.4 2.5 12C4.4 16 7.7 18 12 18C13.4 18 14.7 17.8 15.8 17.3"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>

                        </svg>
                    </button>
                        </div>

                    </div>


                    <!-- FORGOT PASSWORD -->

                    <div class="forgot-row">

                        <a
                            href="#"
                            id="forgotPassword">

                            Forgot password?

                        </a>

                    </div>


                    <!-- SIGN IN BUTTON -->

                    <button
                        type="submit"
                        class="signin-button">

                        <span>
                            Sign in
                        </span>

                        <span class="arrow">
                            →
                        </span>

                    </button>

                </form>


                <!-- ================= OR ================= -->

                <div class="or-divider">

                    <span></span>

                    <p>
                        or
                    </p>

                    <span></span>

                </div>


                <!-- ================= SECURITY BOX ================= -->

                <!-- <div class="security-box"> -->

                    <!-- <div class="security-icon">
                        ✓
                    </div>

                    <div class="security-text">

                        <strong>
                            Secure access for authorized
                        </strong>

                        <span>
                            school staff only.
                        </span> 

                    </div> -->

                <!-- </div> -->


                <!-- ACCESS MESSAGE -->

                <p class="access-text">

                    Need access?

                    <a href="#">
                        Contact your school administrator.
                    </a>

                </p>

            </section>

        </div>


        <!-- ================= BOTTOM SECURITY ================= -->

        <!-- <div class="bottom-security">

            <div class="bottom-check">
                ✓
            </div>

            <span>
                Your data is safe and secure with us.
            </span>

        </div> -->

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
